<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1500" viewBox="0 0 1600 1500" role="img" aria-labelledby="title description">
  <title id="title">Technology Maturity of PA6 Depolymerization–Repolymerization Projects</title>
  <desc id="description">Aquafil T5; BASF, Taihua New Materials and Toray T4; Hengshen New Materials T3. Assessment of specific projects, based on verifiable engineering status as of August 2026.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #193b63; }
      .title { font-size: 46px; font-weight: 700; }
      .legend { font-size: 27px; }
      .heading { font-size: 28px; font-weight: 700; }
      .name { font-size: 36px; font-weight: 700; }
      .detail { font-size: 30px; fill: #3d5874; }
      .level { font-size: 30px; font-weight: 700; text-anchor: middle; }
      .note { font-size: 26px; fill: #496077; }
    </style>
  </defs>
  <rect width="1600" height="1500" fill="#fff"/>
  <text class="title" x="64" y="78">Technology Maturity of PA6</text>
  <text class="title" x="64" y="135">Depolymerization–Repolymerization Projects</text>
  <text class="legend" x="64" y="207">T1 Laboratory Feasibility · T2 Pilot Validation · T3 Integrated Demonstration</text>
  <text class="legend" x="64" y="247">T4 Commercial Operation · T5 Stable Replication</text>
  <path d="M64 276H1536" stroke="#adc8df" stroke-width="2"/>
  <text class="heading" x="64" y="323">Project and publicly reported evidence</text>
  <text class="heading" x="1220" y="323" text-anchor="middle">Evidence level</text>
  <g class="level">
    <text x="1000" y="365">T1</text><text x="1110" y="365">T2</text>
    <text x="1220" y="365">T3</text><text x="1330" y="365">T4</text><text x="1440" y="365">T5</text>
  </g>
  <g fill="#f1f7fb">
    <rect x="64" y="385" width="1472" height="172" rx="10"/>
    <rect x="64" y="745" width="1472" height="172" rx="10"/>
    <rect x="64" y="1105" width="1472" height="172" rx="10"/>
  </g>
  <g stroke="#c5d8e8" stroke-width="2" stroke-dasharray="5 8">
    <path d="M1000 385V1277 M1110 385V1277 M1220 385V1277 M1330 385V1277 M1440 385V1277"/>
  </g>
  <g stroke="#d6e4ef" stroke-width="2">
    <path d="M64 565H1536 M64 745H1536 M64 925H1536 M64 1105H1536"/>
  </g>
  <g>
    <text class="name" x="84" y="433">Aquafil (ECONYL)</text>
    <text class="detail" x="84" y="484">Long-term operation since 2011;</text>
    <text class="detail" x="84" y="528">post-consumer and post-industrial feedstock</text>
    <circle cx="1440" cy="471" r="28" fill="#8760a5"/>
    <text class="level" x="1492" y="481">T5</text>
  </g>
  <g>
    <text class="name" x="84" y="613">BASF (loopamid)</text>
    <text class="detail" x="84" y="664">500 t/y commercial unit in Shanghai;</text>
    <text class="detail" x="84" y="708">GRS certified</text>
    <circle cx="1330" cy="651" r="28" fill="#16968c"/>
    <text class="level" x="1382" y="661">T4</text>
  </g>
  <g>
    <text class="name" x="84" y="789">Taihua New Materials</text>
    <text class="detail" x="84" y="833">(chemical nylon recycling)</text>
    <text class="detail" x="84" y="885">Chemically recycled nylon products and certification</text>
    <circle cx="1330" cy="831" r="28" fill="#16968c"/>
    <text class="level" x="1382" y="841">T4</text>
  </g>
  <g>
    <text class="name" x="84" y="973">Toray (Nylon 6 recycling)</text>
    <text class="detail" x="84" y="1024">Collection–caprolactam–repolymerization</text>
    <text class="detail" x="84" y="1068">operating system</text>
    <circle cx="1330" cy="1011" r="28" fill="#16968c"/>
    <text class="level" x="1382" y="1021">T4</text>
  </g>
  <g>
    <text class="name" x="84" y="1149">Hengshen New Materials</text>
    <text class="detail" x="84" y="1193">(PA6 chemical recycling)</text>
    <text class="detail" x="84" y="1245">7,000 t/y; engineering construction / pilot operation</text>
    <circle cx="1220" cy="1191" r="28" fill="#337bb6"/>
    <text class="level" x="1272" y="1201">T3</text>
  </g>
  <path d="M64 1310H1536" stroke="#adc8df" stroke-width="2"/>
  <text class="note" x="64" y="1355">Note: The assessment concerns a specific recycling technology or project, not overall company strength,</text>
  <text class="note" x="64" y="1395">and reflects verifiable engineering status as of August 2026.</text>
  <text class="note" x="64" y="1450">Sources: public statistics, annual reports, and project documents.</text>
